# Uncertainty-as-penalty (proposal 4.3): MC-5 mean trajectory, full horizon,
#   J = ||mean z_H - z_goal||^2 + penalty_weight * sigma^2_H.
# penalty_weight is environment-specific: for Cube it is selected on the
# calibration seeds by the L1 re-ranking analysis (results/cube/l1/signal_summary.json,
# q5_rerank.lambda_star); cluster/jobs/20_l2_panel.sbatch passes it on the command line.
name: penalty
planner: ua
n_samples: 5
history_size: 3
truncation:
  mode: none
  omega: 1.0
  k_base: 5
  k_min: 1
  k_max: null
  threshold: null
  penalty_weight: 0.0
