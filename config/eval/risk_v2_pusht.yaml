defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

seed: 42
policy: pusht/lewm
cache_dir: null

risk:
  estimator: mcdropout
  n_samples: 5
  ensemble_ckpts: []
  perturb_std: 0.01
  history_size: 3
  objective:
    mode: goal_cvar_eot  # mc_terminal | soft_v1_control | goal_cvar_eot | terminal_sigma_eot
    alpha: 1.0
    tail_fraction: 0.4  # N=5 selects the two largest terminal losses
    tail_count: null
    cap: 2.0
    eps: 1.0e-8
    # Used only by soft_v1_control.
    lambda_weight: null
    distance_scale: 1.0
    uncertainty_scale: 1.0
  # Optional Wu-style horizon truncation applied before soft-penalty scoring.
  # Hybrid Goal-CVaR + adaptive truncation uses mode=adaptive_length.
  truncation:
    mode: none  # none | fixed | adaptive_length | adaptive_perstep | gated
    omega: 0.3
    k_base: 5
    k_min: 1
    k_max: null
    threshold: null
    penalty_weight: 0.0

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

solver:
  num_samples: 300
  n_steps: 30
  topk: 30

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: risk_v2_pusht_results.txt
