defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set in code, must be >= eval_budget

seed: 42
policy: random # ckpt name (e.g. pusht/lewm) or random
cache_dir: null

# --- uncertainty-aware planning settings (the project's contribution) ---
ua:
  estimator: mcdropout      # mcdropout | ensemble | ensemble_perturb
  n_samples: 5              # MC-dropout samples (or perturbed members)
  ensemble_ckpts: []        # for estimator=ensemble: extra checkpoint names
  perturb_std: 0.01         # for estimator=ensemble_perturb
  history_size: 3
  truncation:
    mode: adaptive_length   # none | fixed | adaptive_length | adaptive_perstep | gated
    omega: 0.1              # calibrated weak truncation; omega=1.0 was over-conservative on PushT
    k_base: 5               # baseline rollout length
    k_min: 1
    k_max: null             # null -> full planning horizon
    # gated: scalar; adaptive_perstep: preferably one calibrated value per depth
    threshold: null
    penalty_weight: 0.0     # >0 -> add uncertainty penalty (proposal 4.3 variant)

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

# planning budget
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# Keep the default CEM budget identical to config/eval/solver/cem.yaml so
# deterministic LeWM and UA comparisons are compute-matched. Individual
# experiment scripts may explicitly select a cheaper screening protocol.
solver:
  num_samples: 300
  n_steps: 30
  topk: 30

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: ua_pusht_results.txt
